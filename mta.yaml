_schema-version: "3.3.0"
ID: syzygy-launchpad
description: Syzygy Custom Launchpad
version: 1.0.0

parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
  # Non-secret config — safe to keep in the repo.
  # The actual SCIM client_id / client_secret live in the user-provided
  # service `syzygy-launchpad-ias` (see resources section).
  ias-host: a6cvqiuhb.accounts.ondemand.com
  # XSUAA Trust-Configuration `origin` key used for shadow users that
  # authenticate through the IAS tenant above. Visible in BTP cockpit under
  # Security → Trust Configuration as the "Origin Key" column. Defaults to
  # `sap.custom` which is what most subaccounts use for a custom IAS tenant
  # trust. Override here if your subaccount uses a different origin key.
  ias-origin: sap.custom

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production

modules:

  # ---------- CAP service ----------
  - name: syzygy-launchpad-srv
    type: nodejs
    path: gen/srv
    requires:
      - name: syzygy-launchpad-auth
      - name: syzygy-launchpad-db
      - name: syzygy-launchpad-html5-host
      - name: syzygy-launchpad-ias
      - name: syzygy-launchpad-xsuaa-api
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    parameters:
      buildpack: nodejs_buildpack
      instances: 1
    properties:
      # Plain (non-secret) env vars surfaced to the running container.
      # In MTA, runtime env vars live under module-level `properties:` —
      # `parameters.env:` is NOT recognised by the deploy service.
      IAS_HOST: ${ias-host}
      IAS_ORIGIN: ${ias-origin}
    build-parameters:
      builder: npm-ci

  # ---------- HANA HDI deployer ----------
  - name: syzygy-launchpad-db-deployer
    type: hdb
    path: gen/db
    requires:
      - name: syzygy-launchpad-db
    parameters:
      buildpack: nodejs_buildpack

  # ---------- Approuter ----------
  - name: syzygy-launchpad-approuter
    type: approuter.nodejs
    path: app/router
    requires:
      - name: syzygy-launchpad-auth
      - name: syzygy-launchpad-html5-runtime
      - name: syzygy-launchpad-destination-service
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true
    parameters:
      disk-quota: 512M
      memory: 512M
      keep-existing-routes: true

  # ---------- HTML5 app content deploy ----------
  - name: syzygy-launchpad-app-content
    type: com.sap.application.content
    path: .
    requires:
      - name: syzygy-launchpad-html5-host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - artifacts:
            - syzygylaunchpad.zip
          name: syzygylaunchpad
          target-path: resources/

  - name: syzygylaunchpad
    type: html5
    path: app/launchpad
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms: []

resources:

  - name: syzygy-launchpad-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        tenant-mode: dedicated
        xsappname: syzygy-launchpad-${org}-${space}

  - name: syzygy-launchpad-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

  - name: syzygy-launchpad-html5-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-name: syzygy-launchpad-html5-host
      service-plan: app-host

  - name: syzygy-launchpad-html5-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime

  # Destination service — lets the approuter resolve subaccount-level
  # destinations (e.g. `syzygy-masterdata`) at runtime.
  - name: syzygy-launchpad-destination-service
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite

  # ──────────────────────────────────────────────────────────────────────────
  # IAS SCIM credentials (user-provided service)
  #
  # Holds the Client ID + Client Secret of the System administrator created in
  # SAP Cloud Identity Services (tenant: a6cvqiuhb.accounts.ondemand.com).
  # These are the ONLY two secrets needed for the Administration screen — the
  # rest (tenant host, BTP subaccount id, etc.) are non-secret and live in
  # mta.yaml parameters.
  #
  # Credentials are managed OUT-OF-BAND so that `cf deploy` never overwrites
  # them. Create / update with:
  #
  #   cf cups syzygy-launchpad-ias -p '{
  #     "clientId":"<real-client-id>",
  #     "clientSecret":"<real-client-secret>"
  #   }'
  #   # or, once created:
  #   cf uups syzygy-launchpad-ias -p '{...}'
  #
  # then `cf restage syzygy-launchpad-srv` to pick up the new values.
  #
  # We reference it as `existing-service` so the MTA Deploy Service binds
  # to the existing UPS without trying to (re)create or update it.
  # ──────────────────────────────────────────────────────────────────────────
  - name: syzygy-launchpad-ias
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: syzygy-launchpad-ias

  # ──────────────────────────────────────────────────────────────────────────
  # XSUAA apiaccess — gives our srv module OAuth client credentials it can
  # use to call the BTP Authorization & Trust Management REST API. We use
  # this to (a) list / create BTP Role Collections, (b) assign role
  # collections to shadow users (which also auto-creates the shadow user in
  # the subaccount). Endpoint base after binding lives in
  # VCAP_SERVICES[xsuaa][0].credentials.apiurl
  # (typically https://api.authentication.<region>.hana.ondemand.com).
  # ──────────────────────────────────────────────────────────────────────────
  - name: syzygy-launchpad-xsuaa-api
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: apiaccess
      config:
        xsappname: syzygy-launchpad-api-${org}-${space}
        tenant-mode: dedicated
        # Scopes required to call the BTP Authorization & Trust Management
        # REST API for *write* operations against users / role collections.
        # Without these the API returns 403 "Access is denied" on PUT
        # /sap/rest/authorization/v2/userRoleCollections and on shadow-user
        # lookups. NOTE: simply listing them here is not always sufficient —
        # in some subaccounts you ALSO have to grant the role collection
        # "User and Role Administrator" to the OAuth2 client created by
        # this binding (BTP Cockpit → Security → Users → filter
        # OAuth2ClientCredentials → sb-syzygy-launchpad-api-…).
        authorities:
          - $XSAPPNAME.xs_user.write
          - $XSAPPNAME.xs_user.read
          - $XSAPPNAME.xs_authorization.write
          - $XSAPPNAME.xs_authorization.read
          - $XSAPPNAME.xs_idp.read
